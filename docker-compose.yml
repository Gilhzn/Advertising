services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adv
      POSTGRES_PASSWORD: adv
      POSTGRES_DB: adv
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adv"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
