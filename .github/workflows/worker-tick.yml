name: Worker tick
# Runs apps/worker as a short-lived "tick" instead of an always-on container: every 10 minutes this job
# boots pg-boss, enqueues whatever cron occurrences came due since the previous tick
# (apps/worker/src/lib/catch-up-schedules.ts + the `worker_state` table), drains the queues and exits.
# See docs/deploy.md -> "Worker as a GitHub Actions tick".
on:
  schedule:
    # GitHub's scheduler is best-effort and can delay a run under load; the catch-up logic is what makes
    # that harmless (a late tick still fires every occurrence it missed, exactly once).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Never overlap ticks, and never cancel a tick that is mid-publish: a queued run waits its turn.
concurrency:
  group: worker-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    # The tick itself stops at TICK_MAX_MINUTES (20); this is the outer seatbelt for install/build/migrate.
    timeout-minutes: 30
    env:
      # Core
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      # Claude / Agent SDK
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPERVISOR_MODEL: ${{ secrets.SUPERVISOR_MODEL }}
      AI_MONTHLY_BUDGET_USD: ${{ secrets.AI_MONTHLY_BUDGET_USD }}
      # `improve_app` reads GITHUB_TOKEN, but GitHub Actions reserves `secrets.GITHUB_TOKEN` for its own
      # automatic, repo-scoped token (which cannot touch a user's app repo). Store the real PAT as
      # APP_REPO_GITHUB_TOKEN and expose it under the name the job expects.
      GITHUB_TOKEN: ${{ secrets.APP_REPO_GITHUB_TOKEN }}
      # Media storage
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      # Business email
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      MIGADU_ADMIN_EMAIL: ${{ secrets.MIGADU_ADMIN_EMAIL }}
      MIGADU_API_KEY: ${{ secrets.MIGADU_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Product analytics
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_ORG_ID: ${{ secrets.POSTHOG_ORG_ID }}
      # Platform app credentials
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      # Optional
      LATE_API_KEY: ${{ secrets.LATE_API_KEY }}
      IMAGE_GEN_PROVIDER: ${{ secrets.IMAGE_GEN_PROVIDER }}
      IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
      # Tick runtime
      TICK_MAX_MINUTES: "20"
    steps:
      - uses: actions/checkout@v4

      # A fork or a fresh clone has no secrets, and the schedule still fires there. Decide once, in bash,
      # from the env above (secrets are never available to `if:` expressions as a group, and a missing one
      # would otherwise surface as a confusing pg-boss connection error 3 minutes into the job).
      - id: guard
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "worker tick skipped: add DATABASE_URL and ANTHROPIC_API_KEY as repository secrets (see docs/deploy-vercel.md)"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # NODE_ENV stays unset here on purpose: `NODE_ENV=production` makes pnpm skip devDependencies, and
      # the build needs typescript/turbo/tsx.
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm turbo run build --filter=@adv/worker...

      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm db:migrate
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm -F @adv/worker tick:built
        env:
          NODE_ENV: production
